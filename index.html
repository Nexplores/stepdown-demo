<style>
:root {
  --paper: #f5f7f8;
  --surface: #ffffff;
  --ink: #18242e;
  --ink-2: #4a5866;
  --ink-3: #6f7c88;
  --rule: #dbe2e7;
  --rule-strong: #b9c4cc;
  --accent: #5a2e6e;
  --accent-ink: #ffffff;
  --accent-soft: #f1e9f4;
  --line: #2a5b88;
  --band: #e5edf4;
  --dose: #5a2e6e;
  --alert: #a3241d;
  --alert-soft: #fbeceb;
  --warn: #855600;
  --warn-soft: #fbf1df;
  --ok: #2b6a3e;
  --ok-soft: #e8f3eb;
  --focus: #1b6fd1;
  --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12181d; --surface: #1a2229; --ink: #e8edf1; --ink-2: #b4c0ca; --ink-3: #8b98a4;
    --rule: #2c3741; --rule-strong: #43505b; --accent: #c9a2db; --accent-ink: #1a1220; --accent-soft: #2e2236;
    --line: #8ab9e6; --band: #22303c; --dose: #c9a2db; --alert: #f08d86; --alert-soft: #3a1f1d;
    --warn: #e8b55a; --warn-soft: #362a16; --ok: #84c79a; --ok-soft: #1c3124; --focus: #7db4ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --paper: #12181d; --surface: #1a2229; --ink: #e8edf1; --ink-2: #b4c0ca; --ink-3: #8b98a4;
    --rule: #2c3741; --rule-strong: #43505b; --accent: #c9a2db; --accent-ink: #1a1220; --accent-soft: #2e2236;
    --line: #8ab9e6; --band: #22303c; --dose: #c9a2db; --alert: #f08d86; --alert-soft: #3a1f1d;
    --warn: #e8b55a; --warn-soft: #362a16; --ok: #84c79a; --ok-soft: #1c3124; --focus: #7db4ff;
    color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.skip { position: absolute; left: -999px; } .skip:focus { left: 12px; top: 8px; background: var(--surface); padding: 6px 10px; z-index: 10; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Top bar */
.topbar { display: flex; align-items: center; gap: 28px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 20px; color: var(--accent); }
.brand span { color: var(--ink); letter-spacing: -0.01em; }
nav { display: flex; gap: 4px; }
nav a { text-decoration: none; padding: 8px 12px; border-radius: 6px; color: var(--ink-2); }
nav a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.facility { margin-left: auto; display: flex; gap: 14px; color: var(--ink-2); font-size: 14px; }
.synthetic { background: var(--warn-soft); color: var(--warn); font-size: 13px; padding: 4px 24px; }

main { max-width: 1120px; margin: 0 auto; padding-block: 28px 80px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
main:focus { outline: none; }
h1 { font-size: 31px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.015em; }
h2 { font-size: 20px; margin: 36px 0 10px; }
h3 { font-size: 16px; margin: 0 0 6px; }
p { margin: 0 0 12px; }
.lede { color: var(--ink-2); max-width: 62ch; }
.muted { color: var(--ink-3); }
.small { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }

/* Handover strip: the day's facts in one line */
.handover { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 14px 0 16px; border-bottom: 1px solid var(--rule); margin-bottom: 8px; }
.handover div { display: flex; align-items: baseline; gap: 8px; }
.handover b { font-size: 25px; font-variant-numeric: tabular-nums; }
.handover span { color: var(--ink-2); }

/* Lists and tables */
.queue { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.queue li { display: grid; grid-template-columns: 120px 1fr auto; gap: 6px 20px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--rule); }
.queue .who { font-weight: 700; }
.queue .who small { display: block; font-weight: 400; color: var(--ink-3); font-size: 13px; }
.queue .why { color: var(--ink-2); font-size: 14px; }
table { border-collapse: collapse; width: 100%; background: var(--surface); }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: 13px; color: var(--ink-3); font-weight: 700; background: var(--paper); }
td.num, th.num { text-align: right; }
tr.link-row { cursor: pointer; } tr.link-row:hover td { background: var(--accent-soft); }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; }

/* Status: always icon + text */
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.status svg { flex: none; }
.status.alert { color: var(--alert); } .status.warn { color: var(--warn); } .status.ok { color: var(--ok); } .status.none { color: var(--ink-3); font-weight: 400; }

/* Buttons and forms */
.btn { font: inherit; font-weight: 700; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); padding: 9px 16px; border-radius: 7px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.small { padding: 6px 12px; font-size: 14px; }
label { display: block; font-weight: 700; margin: 14px 0 6px; }
input[type=text], select, textarea { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--rule-strong); border-radius: 7px; background: var(--surface); color: var(--ink); }
textarea { min-height: 96px; resize: vertical; }
.hint { font-size: 14px; color: var(--ink-3); margin: 4px 0 0; }
.error { color: var(--alert); font-weight: 700; margin-top: 10px; }

/* Resident page */
.crumb { display: inline-block; margin-bottom: 14px; color: var(--ink-2); font-size: 14px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 28px; color: var(--ink-2); margin: 6px 0 22px; }
.facts b { color: var(--ink); }
.chart-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 18px 8px; }
.chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; margin-bottom: 6px; }
.chart-head p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 70ch; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--line); vertical-align: middle; margin-right: 6px; }
.legend i.band { height: 10px; border: 0; background: var(--band); }
.legend i.dose { border-top-color: var(--dose); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 13px; line-height: 1.4; padding: 8px 10px; border-radius: 6px; min-width: 170px; transform: translate(-50%, -100%); white-space: nowrap; opacity: 0; transition: opacity .08s; }
.tip b { font-size: 14px; }
details.table-view { margin: 8px 0 6px; font-size: 14px; } details.table-view summary { cursor: pointer; color: var(--ink-2); }

.columns { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; margin-top: 26px; align-items: start; }
.assess { border-left: 4px solid var(--rule-strong); padding: 4px 0 4px 16px; }
.assess.alert { border-color: var(--alert); } .assess.warn { border-color: var(--warn); } .assess.ok { border-color: var(--ok); }
.assess .headline { font-size: 22px; font-weight: 700; line-height: 1.25; margin: 6px 0 8px; }
.evidence { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 4px 26px; margin: 12px 0 0; font-size: 14px; color: var(--ink-2); }
.evidence b { display: block; font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
.decide { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 20px 20px; }
.option { display: flex; gap: 10px; align-items: flex-start; padding: 10px 10px; border: 1px solid var(--rule); border-radius: 8px; margin: 8px 0; cursor: pointer; font-weight: 400; }
.option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.option input { margin-top: 4px; accent-color: var(--accent); }
.tag { font-size: 12px; font-weight: 700; color: var(--accent); margin-left: 6px; }
.signed { background: var(--ok-soft); border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 14px; }
.log { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.log li { padding: 8px 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 96px 1fr; gap: 12px; }
.log li > span:first-child { color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* Check-in */
.checkin { max-width: 720px; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; border: 0; background: var(--surface); color: var(--ink); padding: 10px 18px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule-strong); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.voice-row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
.mic[aria-pressed="true"] { background: var(--alert); border-color: var(--alert); color: #fff; }
.safety { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.safety button { font: inherit; padding: 12px 16px; border-radius: 8px; border: 2px solid var(--rule-strong); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 48px; }
.safety button[aria-pressed="true"] { border-color: var(--alert); background: var(--alert-soft); color: var(--alert); font-weight: 700; }
.scored { margin-top: 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; }
.scored ul { margin: 8px 0 0; padding-left: 18px; }
.scored .total { font-size: 20px; font-weight: 700; }
.notice { border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 14px; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.alert { background: var(--alert-soft); color: var(--alert); }
.actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }

@media (max-width: 820px) {
  .topbar { flex-wrap: wrap; gap: 10px 18px; padding: 10px 16px; }
  .facility { margin-left: 0; width: 100%; }
  main { padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 25px; }
  .columns, .grid2 { grid-template-columns: 1fr; }
  .queue li { grid-template-columns: 1fr auto; }
  .queue .why { grid-column: 1 / -1; }
  .synthetic { padding: 4px 16px; }
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.samples { display: flex; flex-wrap: wrap; gap: 8px; }
.record-host { background: #fff; border: 1px solid var(--rule); border-radius: 10px; overflow-x: auto; color-scheme: light; }
[hidden] { display: none !important; }

<script>
/* stepdown front end: plain JavaScript, no build step. */
"use strict";

const $ = (sel, el = document) => el.querySelector(sel);
const main = () => document.getElementById("main");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x) => (x == null ? "—" : `${Math.round(x * 100)}%`);
const fmtDose = (d, u) => (d == null ? "—" : `${+d.toFixed(2)} ${u}`);
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtDate = (iso) => { if (!iso) return "—"; const [y, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };
const fmtShort = (iso) => { const [, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]}`; };
const phaseName = (p) => (p ? p.replace("step_", "Step ").replace("baseline", "Baseline").replace("stopped", "Stopped").replace("restored", "Restored") : "—");

/* In the published click-through demo there is no server: STATIC holds pre-computed data and
   anything entered (check-ins, decisions, approvals) lives only in this browser tab. */
const STATIC = window.STEPDOWN_STATIC || null;
const local = { checkins: [], decisions: [], orders: [] };

async function api(path, body) {
  if (STATIC) return staticApi(path, body);
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}


function staticApi(path, body) {
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const today = STATIC.meta.today;
  const decidedToday = new Set(local.decisions.map((d) => d.resident_id));
  const resident = (id) => {
    const r = STATIC.residents[id];
    if (!r) throw new Error("Resident not found.");
    const out = clone(r);
    out.checkins = local.checkins.filter((c) => c.resident_id === id).reverse().concat(out.checkins);
    out.decisions = out.decisions.concat(local.decisions.filter((d) => d.resident_id === id));
    out.approved = local.orders.find((o) => o.resident_id === id) || null;
    out.decided_today = decidedToday.has(id);
    return out;
  };
  const stamp = () => new Date().toTimeString().slice(0, 5);
  if (!body) {
    if (path === "/api/facility") {
      const f = clone(STATIC.facility);
      f.residents.forEach((r) => { if (decidedToday.has(r.resident_id)) { r.needs_decision = false; r.decided_today = true; } });
      f.kpis.needs_decision = f.residents.filter((r) => r.needs_decision).length;
      return Promise.resolve(f);
    }
    if (path === "/api/meta") return Promise.resolve(clone(STATIC.meta));
    const m = path.match(/^\/api\/residents\/([\w-]+)$/);
    if (m) return Promise.resolve(resident(m[1]));
    return Promise.reject(new Error("Not available in this demo."));
  }
  if (path === "/api/preview") {
    const hit = STATIC.samples.find((x) => x.note.trim() === body.note.trim());
    if (hit) return Promise.resolve(clone(hit.result));
    return Promise.reject(new Error("In this click-through demo, scoring works for the sample notes above. The full app scores any note."));
  }
  const m = path.match(/^\/api\/residents\/([\w-]+)\/(checkin|order|decision)$/);
  if (!m) return Promise.reject(new Error("Not available in this demo."));
  const [, id, action] = m;
  if (action === "decision") {
    if (!body.clinician.trim()) return Promise.reject(new Error("Enter the prescriber's name to sign."));
    if ((body.option === "restore_previous_dose" || body.option === "hold_step") && !body.rationale.trim())
      return Promise.reject(new Error("Add the clinical rationale: it is required when the medication is continued or restored."));
    const r = STATIC.residents[id];
    local.decisions.push({ resident_id: id, date: today, option: body.option, rationale: body.rationale.trim(), clinician: body.clinician.trim(),
      signed_at: `${today}T${stamp()}`, restore_dose: body.option === "restore_previous_dose" && r.restore ? r.restore.dose : null });
  } else if (action === "order") {
    if (!body.clinician.trim()) return Promise.reject(new Error("Enter the prescriber's name to approve the plan."));
    local.orders.push({ resident_id: id, clinician: body.clinician.trim(), signed_at: `${today}T${stamp()}` });
  } else {
    const x = body.extraction;
    local.checkins.push({ resident_id: id, date: today, shift: body.shift, nurse_id: body.nurse_id, note: body.note,
      score: x.low_information ? null : x.total, events: body.events });
  }
  return Promise.resolve(resident(id));
}

/* Printable record, shown inside the page (its own styles kept separate) */
async function recordView(id) {
  const back = `<a class="crumb" href="#resident-${esc(id)}">Back to ${esc(id)}</a>`;
  if (!STATIC) { location.href = `/records/${encodeURIComponent(id)}`; return; }
  const html = STATIC.records[id];
  if (!html) throw new Error("Record not found.");
  main().innerHTML = `${back}<p class="small muted">The inspection-ready record for ${esc(id)}, as the full app generates it. Decisions signed in this demo are not added to it.</p><div id="record-host" class="record-host"></div>`;
  $("#record-host").attachShadow({ mode: "open" }).innerHTML = html;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3200);
}

/* Status: icon + words, never colour alone */
const ICONS = {
  alert: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 15 14H1z" fill="currentColor"/><path d="M8 6v4M8 11.6v.4" stroke="var(--surface)" stroke-width="1.8" stroke-linecap="round"/></svg>',
  warn: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M8 4.5v4.2M8 11v.3" stroke="var(--surface)" stroke-width="1.8" stroke-linecap="round"/></svg>',
  ok: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="m4.8 8.2 2.2 2.2 4.2-4.6" fill="none" stroke="var(--surface)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  none: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
};
const chip = (tone, label) => `<span class="status ${tone}">${ICONS[tone] || ""}${esc(label)}</span>`;
const MENTION = { fall: "a fall", aggression_injury: "an injury", hospital_transfer: "a hospital transfer", infection_suspected: "signs of infection", new_pain: "new pain" };
const GDR_TONE = { overdue: "alert", due_soon: "warn", up_to_date: "ok", contraindicated: "none" };
const VERDICT_RANK = { symptom_return: 0, possible_return: 1, insufficient_data: 2 };

/* ---------- Router ---------- */
async function route() {
  // Plain #name routes (#residents, #resident-R-106, #checkin, #checkin-R-105, #record-R-106)
  const h = location.hash.slice(1) || "residents";
  if (h === "main") return;
  document.querySelectorAll("nav a").forEach((a) => a.removeAttribute("aria-current"));
  try {
    if (h.startsWith("resident-")) { setNav("residents"); await residentView(h.slice(9)); }
    else if (h.startsWith("record-")) { setNav("residents"); await recordView(h.slice(7)); }
    else if (h.startsWith("checkin")) { setNav("checkin"); await checkinView(h.slice(8)); }
    else { setNav("residents"); await dashboard(); }
  } catch (e) {
    main().innerHTML = `<h1>Couldn't load this page</h1><p class="error">${esc(e.message)}</p><p><a class="btn" href="#residents">Back to residents</a></p>`;
  }
  main().focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
function setNav(k) { const a = document.querySelector(`nav a[data-nav="${k}"]`); if (a) a.setAttribute("aria-current", "page"); }
window.addEventListener("hashchange", route);

/* ---------- Residents dashboard ---------- */
async function dashboard() {
  const d = await api("/api/facility");
  document.getElementById("today").textContent = fmtDate(d.today);
  const k = d.kpis;
  const waiting = d.residents.filter((r) => r.needs_decision)
    .sort((a, b) => (VERDICT_RANK[a.verdict.verdict] - VERDICT_RANK[b.verdict.verdict]) || (b.urgent_alerts - a.urgent_alerts));
  const due = d.residents.filter((r) => !r.in_taper && (r.gdr_status === "overdue" || r.gdr_status === "due_soon"))
    .sort((a, b) => (a.gdr_status === "overdue" ? -1 : 1) - (b.gdr_status === "overdue" ? -1 : 1));

  const queue = waiting.length ? `<ul class="queue">${waiting.map((r) => `
      <li>
        <div class="who">${esc(r.resident_id)}<small>Room ${esc(r.room)}</small></div>
        <div>
          <div>${chip(r.verdict.tone, r.verdict.label)}${r.urgent_alerts ? ` &nbsp;${chip("alert", `${r.urgent_alerts} urgent alert${r.urgent_alerts > 1 ? "s" : ""}`)}` : ""}</div>
          <div class="why">${esc(r.drug)} now ${esc(fmtDose(r.current_dose, r.unit))}, ${esc(phaseName(r.phase).toLowerCase())}. ${esc(r.verdict.rationale)}</div>
        </div>
        <a class="btn small primary" href="#resident-${esc(r.resident_id)}">Review</a>
      </li>`).join("")}</ul>`
    : `<p class="muted">Nothing waiting. Every reduction in progress is on track.</p>`;

  const dueList = due.length ? `<ul class="queue">${due.map((r) => `
      <li>
        <div class="who">${esc(r.resident_id)}<small>Room ${esc(r.room)}</small></div>
        <div>
          <div>${chip(GDR_TONE[r.gdr_status], r.gdr_status_label)} <span class="small muted">&nbsp;Due ${esc(fmtDate(r.gdr_next_due))}</span></div>
          <div class="why">${esc(r.drug)} ${esc(fmtDose(r.starting_dose, r.unit))}. ${esc(r.gdr_reason)}.</div>
        </div>
        <a class="btn small" href="#resident-${esc(r.resident_id)}">Plan a reduction</a>
      </li>`).join("")}</ul>` : `<p class="muted">No reductions overdue or due in the next 30 days.</p>`;

  const rows = d.residents.slice().sort((a, b) => a.resident_id.localeCompare(b.resident_id)).map((r) => `
    <tr class="link-row" data-href="#resident-${esc(r.resident_id)}">
      <td><a href="#resident-${esc(r.resident_id)}">${esc(r.resident_id)}</a></td>
      <td>${esc(r.room)}</td>
      <td>${esc(r.drug)} ${esc(fmtDose(r.starting_dose, r.unit))}</td>
      <td class="num">${r.in_taper ? esc(fmtDose(r.current_dose, r.unit)) : "—"}</td>
      <td>${chip(GDR_TONE[r.gdr_status], r.gdr_status_label)}</td>
      <td>${r.verdict ? chip(r.verdict.tone, r.verdict.label) : '<span class="muted">No reduction in progress</span>'}</td>
      <td class="num">${r.urgent_alerts + r.review_alerts || ""}</td>
    </tr>`).join("");

  main().innerHTML = `
    <h1>Dose reductions</h1>
    <p class="lede">Who needs a prescriber today, who is due a reduction, and how every reduction in progress is going.</p>
    <div class="handover">
      <div><b>${k.needs_decision}</b><span>waiting for a prescriber</span></div>
      <div><b>${k.urgent_alerts}</b><span>urgent alerts this week</span></div>
      <div><b>${k.overdue}</b><span>reductions overdue</span></div>
      <div><b>${k.due_soon}</b><span>due within 30 days</span></div>
      <div><b>${k.in_taper}</b><span>reductions in progress</span></div>
    </div>
    <h2>Waiting for a prescriber</h2>${queue}
    <h2>Reductions due</h2>${dueList}
    <h2>All residents on psychotropics</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Resident</th><th>Room</th><th>Medication</th><th class="num">Dose now</th><th>Reduction status</th><th>Current assessment</th><th class="num">Alerts</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  main().querySelectorAll("tr.link-row").forEach((tr) => tr.addEventListener("click", (e) => { if (e.target.tagName !== "A") location.hash = tr.dataset.href; }));
}

/* ---------- Resident ---------- */
async function residentView(id) {
  const r = await api(`/api/residents/${encodeURIComponent(id)}`);
  const facts = `
    <div class="facts">
      <span>Room <b>${esc(r.room)}</b></span><span><b>${esc(r.age)}</b>, ${r.sex === "F" ? "female" : "male"}</span>
      <span>Dementia: <b>${r.dementia ? "yes" : "no"}</b></span>
      <span><b>${esc(r.drug)}</b> ${esc(fmtDose(r.starting_dose, r.unit))} since ${esc(fmtDate(r.drug_start))}</span>
      <span>${chip(GDR_TONE[r.gdr_status], r.gdr_status_label)}</span>
    </div>`;
  if (!r.in_taper) return planView(r, facts);

  const v = r.verdict;
  const opts = v.options.length ? v.options.map((o, i) => `
      <label class="option"><input type="radio" name="opt" value="${esc(o.key)}"><span>${esc(o.label)}${o.key === "restore_previous_dose" && r.restore ? ` (${esc(fmtDose(r.restore.dose, r.unit))})<br><span class="small muted">${esc(r.restore.basis)}</span>` : ""}${i === 0 ? '<span class="tag">Suggested</span>' : ""}</span></label>`).join("")
    + `<label class="option"><input type="radio" name="opt" value="other"><span>Other (describe in the rationale)</span></label>` : "";
  const signed = r.decisions.slice().reverse().map((d) => `
      <div class="signed">${chip("ok", "Signed")} <b>${esc(optionLabel(d.option, v))}${d.restore_dose != null ? ` (${esc(fmtDose(d.restore_dose, r.unit))})` : ""}</b><br>
      ${esc(d.clinician)}, ${esc(fmtDate(d.date))} at ${esc((d.signed_at || "").slice(11))}${d.rationale ? `<br><span class="muted">${esc(d.rationale)}</span>` : ""}</div>`).join("");

  const alerts = r.alerts.length ? `<ul class="log">${r.alerts.map((a) => `<li><span>${esc(fmtShort(a.date))}</span><span>${chip(a.level === "urgent" ? "alert" : "warn", a.level === "urgent" ? "Urgent" : "Review")} ${esc(a.reason)}</span></li>`).join("")}</ul>` : `<p class="muted small">No safety alerts in the last 7 days.</p>`;
  const events = r.events.length ? `<ul class="log">${r.events.map((e) => `<li><span>${esc(fmtShort(e.date))}</span><span>${esc(e.event.replace(/_/g, " ").replace(/^\w/, (c) => c.toUpperCase()))}: ${esc(e.detail)}</span></li>`).join("")}</ul>` : `<p class="muted small">No events recorded.</p>`;
  const checkins = r.checkins.length ? `<ul class="log">${r.checkins.map((c) => `<li><span>${esc(fmtShort(c.date))}, ${esc(c.shift)}</span><span>${c.score == null ? chip("warn", "Not scored: no behaviour described") : `<b class="num">${c.score}</b> of 70`} &nbsp;“${esc(c.note)}” <span class="muted">(${esc(c.nurse_id)})</span></span></li>`).join("")}</ul>` : `<p class="muted small">No check-ins entered in the app yet. <a href="#checkin-${esc(r.resident_id)}">Add one</a>.</p>`;

  main().innerHTML = `
    <a class="crumb" href="#residents">Residents</a>
    <h1>${esc(r.resident_id)}</h1>${facts}
    <section class="chart-card" aria-labelledby="chart-title">
      <div class="chart-head">
        <div><h3 id="chart-title">Agitation and dose since the reduction began</h3>
          <p>Daily agitation score (14 = none, 70 = maximum), adjusted for consistent differences between nurses. The shaded band is this resident's own baseline, plus or minus the meaningful change of ${r.meaningful_change} points.</p></div>
        <div class="legend"><span><i></i>Daily agitation</span><span><i class="band"></i>Baseline range</span><span><i class="dose"></i>Dose</span></div>
      </div>
      <div class="chart" id="chart" tabindex="0" aria-label="Agitation and dose chart. Use left and right arrow keys to read each day."></div>
      <details class="table-view"><summary>Show the data as a table</summary>${seriesTable(r)}</details>
    </section>
    <div class="columns">
      <section>
        <div class="assess ${esc(v.tone)}">
          <div class="small muted">Assessment of the current step: ${esc(phaseName(v.phase))}</div>
          <div class="headline">${esc(v.label)}</div>
          <p>${esc(v.rationale)}</p>
          ${v.change_points == null ? "" : `<div class="evidence">
            <div><b>${v.change_points > 0 ? "+" : ""}${esc(v.change_points)}</b>points vs baseline</div>
            <div><b>${pct(v.p_return)}</b>chance of a real return</div>
            <div><b>${pct(v.completeness)}</b>shifts recorded, last 10 days</div>
          </div>`}
          ${v.onset_estimate ? `<p class="small muted" style="margin-top:10px">Estimated onset ${esc(fmtDate(v.onset_estimate))}</p>` : ""}
        </div>
        <h2>Safety alerts</h2>${alerts}
        <h2>Events</h2>${events}
        <h2>Check-ins entered in the app</h2>${checkins}
      </section>
      <section class="decide" aria-labelledby="decide-title">
        <h3 id="decide-title">Prescriber decision</h3>
        ${v.options.length ? `
        <p class="small muted">The software suggests; you decide. Nothing changes until you sign.</p>
        <form id="decide-form">
          <fieldset style="border:0;padding:0;margin:0"><legend class="sr">Options</legend>${opts}</fieldset>
          <label for="rationale">Clinical rationale</label>
          <textarea id="rationale" placeholder="Why this decision, for this resident"></textarea>
          <p class="hint">Required if the medication is continued or restored.</p>
          <label for="clinician">Prescriber name</label>
          <input type="text" id="clinician" autocomplete="name" placeholder="Dr A. Patel">
          <div class="actions"><button class="btn primary" type="submit">Sign decision</button>
            ${recordLink(r.resident_id)}</div>
          <div class="error" id="decide-error" role="alert"></div>
        </form>` : `<p>${esc(v.rationale)}</p><div class="actions">${recordLink(r.resident_id)}</div>`}
        ${signed}
      </section>
    </div>`;

  drawChart($("#chart"), r);
  const form = $("#decide-form");
  if (form) form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const opt = form.querySelector("input[name=opt]:checked");
    const err = $("#decide-error"); err.textContent = "";
    if (!opt) { err.textContent = "Choose an option to sign."; return; }
    try {
      await api(`/api/residents/${encodeURIComponent(r.resident_id)}/decision`, { option: opt.value, rationale: $("#rationale").value, clinician: $("#clinician").value });
      toast(`Decision signed for ${r.resident_id}`);
      await residentView(r.resident_id);
    } catch (ex) { err.textContent = ex.message; }
  });
}

function recordLink(id) {
  return STATIC ? `<a class="btn" href="#record-${esc(id)}">Open printable record</a>`
    : `<a class="btn" href="/records/${esc(id)}" target="_blank" rel="noopener">Open printable record</a>`;
}

function optionLabel(key, v) {
  const o = (v.options || []).find((x) => x.key === key);
  const known = { restore_previous_dose: "Restore the last dose before symptoms returned", hold_step: "Hold at the current dose and keep monitoring", continue_taper: "Continue to the next reduction step", stop_successful: "Record the reduction as successful – drug stopped", review_non_drug_causes: "Review non-drug causes (pain, infection, sleep, environment)" };
  return o ? o.label : known[key] ? known[key] : key === "other" ? "Other" : key.replace(/_/g, " ").replace(/^\w/, (c) => c.toUpperCase());
}

function planView(r, facts) {
  const rows = r.proposed_plan.map((p) => `<tr><td>${esc(phaseName(p.phase))}</td><td class="num">${esc(fmtDose(p.dose, p.unit))}</td><td>${esc(fmtDate(p.start))} to ${esc(fmtDate(p.end))}</td></tr>`).join("");
  const blocked = r.gdr_status === "contraindicated";
  if (r.approved) {
    main().innerHTML = `<a class="crumb" href="#residents">Residents</a><h1>${esc(r.resident_id)}</h1>${facts}
      <div class="signed" style="max-width:640px">${chip("ok", "Approved")} Reduction plan approved by ${esc(r.approved.clinician)} at ${esc(r.approved.signed_at.slice(11))}.
      In the full app, baseline observation starts today and ${esc(r.resident_id)} appears in the shift check-in.</div>`;
    return;
  }
  main().innerHTML = `
    <a class="crumb" href="#residents">Residents</a>
    <h1>${esc(r.resident_id)}</h1>${facts}
    <p class="lede">No reduction in progress. ${esc(r.gdr_reason)}.</p>
    <h2>Proposed reduction plan</h2>
    <p class="small muted">Two weeks of baseline observation first, then the dose steps down by a quarter every two weeks. Each step is monitored before the next one starts.</p>
    <div class="table-wrap" style="max-width:640px"><table><thead><tr><th>Phase</th><th class="num">Dose</th><th>Dates</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${blocked ? `<p class="notice warn" style="max-width:640px">A clinical contraindication is documented until ${esc(fmtDate(r.gdr_next_due))}. Review it before starting a reduction.</p>` : ""}
    <form id="order-form" style="max-width:420px">
      <label for="clinician">Prescriber name</label>
      <input type="text" id="clinician" autocomplete="name" placeholder="Dr A. Patel">
      <div class="actions"><button class="btn primary" type="submit">Approve and start baseline</button></div>
      <div class="error" id="order-error" role="alert"></div>
    </form>`;
  $("#order-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await api(`/api/residents/${encodeURIComponent(r.resident_id)}/order`, { clinician: $("#clinician").value });
      toast(`Reduction approved for ${r.resident_id}. Baseline starts today.`);
      await residentView(r.resident_id);
    } catch (ex) { $("#order-error").textContent = ex.message; }
  });
}

function seriesTable(r) {
  return `<div class="table-wrap" style="max-height:280px;overflow:auto;margin-top:8px"><table><thead><tr><th>Date</th><th class="num">Agitation (adjusted)</th><th class="num">Shifts recorded</th><th>Shift scores</th><th class="num">Dose</th></tr></thead><tbody>${
    r.series.map((s) => `<tr><td>${esc(fmtDate(s.date))}</td><td class="num">${s.score ?? "—"}</td><td class="num">${s.shifts}</td><td>${esc(s.raw.join(", "))}</td><td class="num">${esc(fmtDose(s.dose, r.unit))}</td></tr>`).join("")}</tbody></table></div>`;
}

/* ---------- Chart: agitation (top) and dose staircase (bottom), shared time axis ---------- */
function drawChart(el, r) {
  const S = r.series.filter((s) => s.date);
  if (!S.length) { el.innerHTML = '<p class="muted">No observations yet.</p>'; return; }
  const dayMs = 864e5, t0 = Date.parse(S[0].date), tEnd = Date.parse(S[S.length - 1].date);
  const W = Math.max(320, el.clientWidth), m = { l: 38, r: 14, t: 10 }, H1 = 230, gap = 30, H2 = 64, axisH = 22;
  const H = m.t + H1 + gap + H2 + axisH;
  const x = (iso) => m.l + ((Date.parse(iso) - t0) / Math.max(dayMs, tEnd - t0)) * (W - m.l - m.r);
  const scores = S.flatMap((s) => [s.score, ...s.raw]).filter((v) => v != null);
  const yMax = Math.max(50, Math.ceil((Math.max(...scores) + 4) / 10) * 10), yMin = 14;
  const y = (v) => m.t + H1 - ((v - yMin) / (yMax - yMin)) * H1;
  const doses = S.map((s) => s.dose).filter((d) => !isNaN(d));
  const dMax = Math.max(...doses, r.starting_dose) || 1;
  const yd = (d) => m.t + H1 + gap + H2 - (d / dMax) * (H2 - 14);

  const parts = [];
  // grid + y labels
  for (let v = 20; v <= yMax; v += 10) parts.push(`<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--rule)" stroke-width="1"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" style="fill:var(--ink-3)">${v}</text>`);
  // baseline band
  if (r.baseline_mean != null) {
    const lo = Math.max(yMin, r.baseline_mean - r.meaningful_change), hi = r.baseline_mean + r.meaningful_change;
    parts.push(`<rect x="${m.l}" width="${W - m.l - m.r}" y="${y(hi)}" height="${y(lo) - y(hi)}" style="fill:var(--band)"/>`);
    parts.push(`<line x1="${m.l}" x2="${W - m.r}" y1="${y(r.baseline_mean)}" y2="${y(r.baseline_mean)}" style="stroke:var(--ink-3)" stroke-dasharray="3 4"/>`);
  }
  // phase boundaries through both panels
  r.plan.forEach((p, i) => { if (i && Date.parse(p.start) <= tEnd) { const px = x(p.start); parts.push(`<line x1="${px}" x2="${px}" y1="${m.t}" y2="${m.t + H1 + gap + H2}" style="stroke:var(--rule-strong)" stroke-dasharray="2 4"/>`); } });
  // raw shift scores
  S.forEach((s) => s.raw.forEach((v) => parts.push(`<circle cx="${x(s.date)}" cy="${y(v)}" r="2.1" style="fill:var(--ink-3)" opacity=".35"/>`)));
  // daily line with gaps
  let d = "", pen = false;
  S.forEach((s) => { if (s.score == null) { pen = false; return; } d += `${pen ? "L" : "M"}${x(s.date).toFixed(1)},${y(s.score).toFixed(1)}`; pen = true; });
  parts.push(`<path d="${d}" fill="none" style="stroke:var(--line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`);
  // estimated onset
  if (r.verdict && r.verdict.onset_estimate) { const ox = x(r.verdict.onset_estimate); parts.push(`<line x1="${ox}" x2="${ox}" y1="${m.t}" y2="${m.t + H1}" style="stroke:var(--alert)" stroke-width="1.5"/><text x="${ox + 5}" y="${m.t + 12}" font-size="12" style="fill:var(--ink-2)">Estimated onset</text>`); }
  // events along the bottom of the top panel
  r.events.forEach((e) => { if (Date.parse(e.date) < t0) return; const ex = x(e.date), ey = m.t + H1 - 2; parts.push(`<path d="M${ex},${ey - 9} l5,9 h-10z" style="fill:var(--warn)"><title>${esc(fmtShort(e.date))}: ${esc(e.detail)}</title></path>`); });
  // dose staircase
  let sd = "", prev = null;
  S.forEach((s, i) => { if (isNaN(s.dose)) return; const px = x(s.date); if (prev === null) sd += `M${px},${yd(s.dose)}`; else if (s.dose !== prev) sd += `H${px}V${yd(s.dose)}`; prev = s.dose; if (i === S.length - 1) sd += `H${px}`; });
  parts.push(`<text x="${m.l - 8}" y="${m.t + H1 + gap - 6}" text-anchor="end" font-size="11" style="fill:var(--ink-3)">Dose</text>`);
  parts.push(`<line x1="${m.l}" x2="${W - m.r}" y1="${yd(0)}" y2="${yd(0)}" style="stroke:var(--rule)"/>`);
  parts.push(`<path d="${sd}" fill="none" style="stroke:var(--dose)" stroke-width="2.4" stroke-linejoin="round"/>`);
  r.plan.forEach((p) => { if (Date.parse(p.start) > tEnd) return; const px = Math.max(m.l, x(p.start)); parts.push(`<text x="${px + 4}" y="${yd(p.dose) - 5}" font-size="11" style="fill:var(--ink-2)">${esc(fmtDose(p.dose, p.unit))}</text>`); });
  // x axis ticks weekly
  const axisY = m.t + H1 + gap + H2 + 16;
  const tickDays = W < 520 ? 21 : W < 800 ? 14 : 7;
  for (let t = t0; t <= tEnd; t += tickDays * dayMs) { const iso = new Date(t).toISOString().slice(0, 10); parts.push(`<text x="${x(iso)}" y="${axisY}" text-anchor="middle" font-size="11" style="fill:var(--ink-3)">${fmtShort(iso)}</text>`); }
  // hover layer
  parts.push(`<line id="xh" y1="${m.t}" y2="${m.t + H1 + gap + H2}" style="stroke:var(--ink-2)" stroke-width="1" opacity="0"/><circle id="xd" r="5" style="fill:var(--line);stroke:var(--surface)" stroke-width="2" opacity="0"/>`);
  parts.push(`<rect id="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H1 + gap + H2}" fill="transparent"/>`);

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Daily agitation score and dose over time">${parts.join("")}</svg><div class="tip"></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = el.querySelector("#xh"), xd = el.querySelector("#xd");
  const evByDate = {}; r.events.forEach((e) => (evByDate[e.date] = (evByDate[e.date] || []).concat(e)));
  let idx = S.length - 1;
  const show = (i) => {
    idx = Math.max(0, Math.min(S.length - 1, i)); const s = S[idx], px = x(s.date);
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("opacity", 1);
    if (s.score != null) { xd.setAttribute("cx", px); xd.setAttribute("cy", y(s.score)); xd.setAttribute("opacity", 1); } else xd.setAttribute("opacity", 0);
    const ev = (evByDate[s.date] || []).map((e) => `<br>${esc(e.detail)}`).join("");
    tip.innerHTML = `<b>${esc(fmtDate(s.date))}</b><br>Agitation ${s.score ?? "not recorded"}${s.raw.length ? ` <span style="opacity:.75">(shifts: ${esc(s.raw.join(", "))})</span>` : ""}<br>${s.shifts} of 3 shifts recorded<br>Dose ${esc(fmtDose(s.dose, r.unit))}${ev}`;
    const scale = el.clientWidth / W;
    tip.style.left = `${Math.min(el.clientWidth - 100, Math.max(100, px * scale))}px`;
    tip.style.top = `${(s.score != null ? y(s.score) : m.t + 40) * scale - 12}px`;
    tip.style.opacity = 1;
  };
  const hide = () => { xh.setAttribute("opacity", 0); xd.setAttribute("opacity", 0); tip.style.opacity = 0; };
  const nearest = (clientX) => { const b = svg.getBoundingClientRect(); const sx = ((clientX - b.left) / b.width) * W; let best = 0, bd = Infinity; S.forEach((s, i) => { const dd = Math.abs(x(s.date) - sx); if (dd < bd) { bd = dd; best = i; } }); return best; };
  const hit = el.querySelector("#hit");
  hit.addEventListener("mousemove", (e) => show(nearest(e.clientX)));
  hit.addEventListener("mouseleave", hide);
  hit.addEventListener("touchstart", (e) => show(nearest(e.touches[0].clientX)), { passive: true });
  el.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") { show(idx - 1); e.preventDefault(); } if (e.key === "ArrowRight") { show(idx + 1); e.preventDefault(); } if (e.key === "Escape") hide(); });
  el.addEventListener("blur", hide);
  clearTimeout(drawChart._rz);
  window.onresize = () => { clearTimeout(drawChart._rz); drawChart._rz = setTimeout(() => { if (document.body.contains(el)) drawChart(el, r); }, 150); };
}

/* ---------- Nurse check-in ---------- */
async function checkinView(preselect) {
  const [meta, fac] = await Promise.all([api("/api/meta"), api("/api/facility")]);
  document.getElementById("today").textContent = fmtDate(meta.today);
  const people = fac.residents.filter((r) => r.in_taper).sort((a, b) => a.resident_id.localeCompare(b.resident_id));
  const hour = new Date().getHours();
  let shift = hour >= 7 && hour < 15 ? "day" : hour >= 15 && hour < 23 ? "evening" : "night";
  const pressed = new Set();
  let scored = null;

  main().innerHTML = `
    <div class="checkin">
      <h1>Shift check-in</h1>
      <p class="lede">Under a minute per resident. Say what you saw this shift, then press any safety event that happened.</p>
      <div class="grid2">
        <div><label for="who">Resident</label>
          <select id="who">${people.map((r) => `<option value="${esc(r.resident_id)}" ${r.resident_id === preselect ? "selected" : ""}>${esc(r.resident_id)}, room ${esc(r.room)} (${esc(r.drug)} ${esc(fmtDose(r.current_dose, r.unit))})</option>`).join("")}</select></div>
        <div><label for="nurse">Your ID</label><select id="nurse"></select></div>
      </div>
      <label id="shift-label">Shift</label>
      <div class="seg" role="group" aria-labelledby="shift-label">${["day", "evening", "night"].map((s) => `<button type="button" data-shift="${s}" aria-pressed="${s === shift}">${s[0].toUpperCase() + s.slice(1)}</button>`).join("")}</div>
      ${STATIC ? `<label>Try a sample note</label><div class="samples">${STATIC.samples.map((x, i) => `<button type="button" class="btn small" data-sample="${i}">${esc(x.label)}</button>`).join("")}</div>` : ""}
      <label for="note">What did you see this shift?</label>
      <textarea id="note" placeholder="For example: pacing most of the evening, shouted at a carer twice, refused her tablets."></textarea>
      <div class="voice-row">
        <button type="button" class="btn mic" id="mic" aria-pressed="false" hidden>Speak instead</button>
        <button type="button" class="btn" id="score">Check the score</button>
        <span class="hint" id="voice-hint"></span>
      </div>
      <div id="scored"></div>
      <label id="safety-label">Safety events this shift</label>
      <div class="safety" role="group" aria-labelledby="safety-label">${Object.entries(meta.checkin_events).map(([k, l]) => `<button type="button" data-ev="${k}" aria-pressed="false">${esc(l)}</button>`).join("")}</div>
      <p class="hint">Press only events that happened this shift. These always reach the prescriber, whatever the note says.</p>
      <div class="actions"><button class="btn primary" id="save">Save check-in</button></div>
      <div class="error" id="save-error" role="alert"></div>
      <div id="after"></div>
      <p class="hint" style="margin-top:28px">${STATIC ? "In this click-through demo, the sample notes were scored ahead of time by the same engine the full app uses." : `Notes are scored by ${meta.extractor === "claude" ? "Claude" : "offline rules (add an API key to use Claude)"}. Voice typing uses your browser's speech service: synthetic demo use only.`}</p>
    </div>`;

  const nurseSel = $("#nurse");
  const fillNurses = () => { nurseSel.innerHTML = meta.nurses[shift].map((n) => `<option>${esc(n)}</option>`).join(""); };
  fillNurses();
  main().querySelectorAll("[data-shift]").forEach((b) => b.addEventListener("click", () => {
    shift = b.dataset.shift; main().querySelectorAll("[data-shift]").forEach((x) => x.setAttribute("aria-pressed", x === b)); fillNurses();
  }));
  main().querySelectorAll("[data-ev]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.ev; pressed.has(k) ? pressed.delete(k) : pressed.add(k); b.setAttribute("aria-pressed", pressed.has(k)); renderScore();
  }));
  main().querySelectorAll("[data-sample]").forEach((b) => b.addEventListener("click", () => {
    $("#note").value = STATIC.samples[+b.dataset.sample].note; $("#note").dispatchEvent(new Event("input")); $("#note").focus();
  }));
  $("#note").addEventListener("input", () => { if (scored && scored.note !== $("#note").value) { scored = null; $("#scored").innerHTML = ""; } });

  function renderScore() {
    if (!scored) return;
    const x = scored.data, labels = x.item_labels;
    const items = Object.entries(x.items).filter(([, v]) => v > 1);
    const freq = { 2: "once", 3: "a few times", 4: "several times", 5: "almost constantly" };
    const missing = x.suggested_events.filter((e) => !pressed.has(e.key));
    $("#scored").innerHTML = `<div class="scored" aria-live="polite">
      ${x.low_information ? `<div class="notice warn" style="margin-top:0">This note doesn't describe any behaviour, so it won't count towards the assessment. Add what you saw, or save it as it is.</div>`
        : `<div class="total">Agitation score <span class="num">${x.total}</span> of 70</div><div class="small muted">14 means no agitation seen.</div>
           ${items.length ? `<ul>${items.map(([k, v]) => `<li><b>${esc(labels[k])}</b>: ${freq[v]}${x.evidence && x.evidence[k] ? ` <span class="muted">(“${esc(x.evidence[k])}”)</span>` : ""}</li>`).join("")}</ul>` : `<p class="small" style="margin:6px 0 0">No agitation behaviours described.</p>`}`}
      ${missing.map((e) => `<div class="notice alert">The note mentions ${esc(MENTION[e.key] || e.label.toLowerCase())}. If it happened, press <b>${esc(e.label)}</b> below.</div>`).join("")}
    </div>`;
  }

  async function doScore() {
    const note = $("#note").value.trim();
    if (!note) { $("#save-error").textContent = "Write or say what you saw first."; return null; }
    $("#score").disabled = true; $("#score").textContent = "Scoring…";
    try { scored = { note: $("#note").value, data: await api("/api/preview", { note }) }; renderScore(); return scored; }
    finally { $("#score").disabled = false; $("#score").textContent = "Check the score"; }
  }
  $("#score").addEventListener("click", () => { $("#save-error").textContent = ""; doScore().catch((e) => ($("#save-error").textContent = e.message)); });

  $("#save").addEventListener("click", async () => {
    const err = $("#save-error"); err.textContent = "";
    const rid = $("#who").value;
    try {
      const s = scored && scored.note === $("#note").value ? scored : await doScore();
      if (!s) return;
      const res = await api(`/api/residents/${encodeURIComponent(rid)}/checkin`, { shift, nurse_id: nurseSel.value, note: s.note.trim(), events: [...pressed], extraction: s.data });
      toast(`Check-in saved for ${rid}, ${shift} shift`);
      $("#after").innerHTML = STATIC
        ? `<div class="signed">${chip("ok", "Saved")} Saved in this demo. In the full app the engine reassesses ${esc(rid)} straight away. <a href="#resident-${esc(rid)}">Open ${esc(rid)}</a></div>`
        : `<div class="signed">${chip("ok", "Saved")} ${esc(rid)} is now assessed as <b>${esc(res.verdict.label.toLowerCase())}</b>. <a href="#resident-${esc(rid)}">Open ${esc(rid)}</a></div>`;
      $("#note").value = ""; scored = null; $("#scored").innerHTML = ""; pressed.clear();
      main().querySelectorAll("[data-ev]").forEach((b) => b.setAttribute("aria-pressed", "false"));
    } catch (e) { err.textContent = e.message; }
  });

  // Voice typing where the browser supports it
  const SR = STATIC ? null : (window.SpeechRecognition || window.webkitSpeechRecognition);
  if (SR) {
    const mic = $("#mic"); mic.hidden = false;
    let rec = null;
    mic.addEventListener("click", () => {
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true;
      const before = $("#note").value ? $("#note").value.trim() + " " : "";
      rec.onresult = (e) => { let t = ""; for (const r of e.results) t += r[0].transcript; $("#note").value = before + t.trim(); $("#note").dispatchEvent(new Event("input")); };
      rec.onend = () => { rec = null; mic.setAttribute("aria-pressed", "false"); mic.textContent = "Speak instead"; $("#voice-hint").textContent = ""; };
      rec.onerror = (e) => { $("#voice-hint").textContent = e.error === "not-allowed" ? "Allow microphone access to use voice." : "Voice stopped. You can type instead."; };
      rec.start(); mic.setAttribute("aria-pressed", "true"); mic.textContent = "Stop"; $("#voice-hint").textContent = "Listening…";
    });
  }
}

route();

</script>
